name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,docs]"
      - name: Lint
        run: ruff check . --fix --diff
      - name: Type check
        run: mypy
      - name: Tests and JSON Schema validation
        run: pytest
      - name: Offline MockProvider demo
        run: lexicon-pipeline --config examples/project.demo.json demo --reset
      - name: Public release audit
        run: lexicon-pipeline audit-public-release --root .
      - name: Documentation strict build
        run: mkdocs build --strict
